version: 2
updates:
  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sportbeacon-team"
    assignees:
      - "sportbeacon-team"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
      firebase-updates:
        patterns:
          - "firebase*"
          - "@firebase/*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
          - "vite*"
          - "vitest*"
          - "jest*"
          - "playwright*"
          - "lighthouse*"
          - "@lhci/*"
          - "turbo"
          - "tsx"
          - "tsup"
          - "esbuild"
          - "prettier"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"

  # Frontend workspace
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sportbeacon-team"
    assignees:
      - "sportbeacon-team"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    groups:
      react-updates:
        patterns:
          - "react*"
          - "@types/react*"
      ui-dependencies:
        patterns:
          - "lucide-react"
          - "react-router-dom"
          - "react-toastify"
          - "react-chartjs-2"
          - "socket.io-client"
          - "stripe"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"

  # Functions workspace
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sportbeacon-team"
    assignees:
      - "sportbeacon-team"
    commit-message:
      prefix: "chore(functions)"
      include: "scope"
    groups:
      firebase-functions:
        patterns:
          - "firebase-functions"
          - "firebase-admin"
          - "@firebase/*"
      server-dependencies:
        patterns:
          - "express"
          - "cors"
          - "helmet"
          - "morgan"
          - "lodash"
          - "moment"
          - "dotenv"
          - "axios"
        update-types:
          - "minor"
          - "patch"

  # MCP Server workspace
  - package-ecosystem: "npm"
    directory: "/packages/mcp-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 3
    reviewers:
      - "sportbeacon-team"
    assignees:
      - "sportbeacon-team"
    commit-message:
      prefix: "chore(mcp-server)"
      include: "scope"
    groups:
      mcp-dependencies:
        patterns:
          - "express"
          - "cors"
          - "helmet"
          - "zod"
          - "firebase-admin"
          - "jsonwebtoken"
          - "rate-limiter-flexible"
        update-types:
          - "minor"
          - "patch"