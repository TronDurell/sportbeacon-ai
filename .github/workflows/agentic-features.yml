name: Agentic Features CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/mcp-server/**'
      - 'functions/agents/**'
      - 'frontend/src/components/agent/**'
      - 'frontend/src/hooks/useAgentClient.ts'
      - 'firestore.rules'
      - 'firestore.indexes.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/mcp-server/**'
      - 'functions/agents/**'
      - 'frontend/src/components/agent/**'
      - 'frontend/src/hooks/useAgentClient.ts'
      - 'firestore.rules'
      - 'firestore.indexes.json'

env:
  NODE_VERSION: '18'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

jobs:
  # MCP Server Tests
  mcp-server-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build MCP Server
        run: npm run mcp:build

      - name: Run MCP Server tests
        run: cd packages/mcp-server && npm test

      - name: Run MCP Server linting
        run: npm run lint:agents

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: packages/mcp-server/coverage/lcov.info
          flags: mcp-server

  # Firebase Functions Tests
  functions-tests:
    name: Firebase Functions Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Functions tests
        run: npm run test:functions

      - name: Run Functions linting
        run: npm run lint:functions

  # Frontend Agent Components Tests
  frontend-agent-tests:
    name: Frontend Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Run frontend linting
        run: npm run lint:frontend

  # Firestore Rules Validation
  firestore-validation:
    name: Firestore Rules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firestore rules
        run: firebase firestore:rules:validate --project ${{ env.FIREBASE_PROJECT_ID }}

      - name: Validate Firestore indexes
        run: firebase firestore:indexes:validate --project ${{ env.FIREBASE_PROJECT_ID }}

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [mcp-server-tests, functions-tests, frontend-agent-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firebase emulators
        run: |
          firebase emulators:start --only firestore,auth,functions --project sportbeaconai-test &
          sleep 10

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run e2e:emulator

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [mcp-server-tests, functions-tests, frontend-agent-tests, firestore-validation, integration-tests, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build all packages
        run: |
          npm run mcp:build
          npm run build:functions
          npm run build:frontend

      - name: Deploy to Firebase Staging
        run: |
          firebase deploy --only functions,firestore:rules,firestore:indexes,hosting --project sportbeaconai-staging

      - name: Run post-deployment tests
        run: npm run test:post-deployment

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build all packages
        run: |
          npm run mcp:build
          npm run build:functions
          npm run build:frontend

      - name: Deploy to Firebase Production
        run: |
          firebase deploy --only functions,firestore:rules,firestore:indexes,hosting --project sportbeaconai-prod

      - name: Run production health checks
        run: npm run test:production-health

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: 'Agentic features deployed to production successfully! 🚀'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
