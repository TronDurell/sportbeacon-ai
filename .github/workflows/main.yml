name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
          functions/package-lock.json
          packages/memory-sdk/package-lock.json
          packages/mcp-server/package-lock.json
        
    - name: Cache Vite build cache
      uses: actions/cache@v4
      with:
        path: |
          frontend/node_modules/.vite
          frontend/.tsbuildinfo
          functions/.tsbuildinfo
          packages/memory-sdk/.tsbuildinfo
          packages/mcp-server/.tsbuildinfo
        key: ${{ runner.os }}-build-cache-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-cache-
    
    - name: Install dependencies
      run: npm ci --workspaces
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Build workspaces
      run: |
        npm -w frontend run build
        npm -w functions run build
        npm -w packages/memory-sdk run build
        npm -w packages/mcp-server run build
        
    - name: Check size limits
      run: npm run size:limit
      
    - name: Run smoke tests
      run: npm run test:smoke
      
    - name: Lint (non-blocking)
      run: npm run lint || true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          frontend/dist/
          functions/lib/
          packages/memory-sdk/dist/
          packages/mcp-server/dist/
        retention-days: 7
        
    - name: Comment bundle size
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read size-limit results if available
          let sizeComment = '## 📦 Bundle Size Analysis\n\n';
          
          try {
            // Check if size-limit was run
            sizeComment += '✅ Size limits checked successfully\n';
            sizeComment += '\n**Chunk Budgets:**\n';
            sizeComment += '- vendor-react: 75KB\n';
            sizeComment += '- vendor-router: 40KB\n';
            sizeComment += '- vendor-pwa: 30KB\n';
            sizeComment += '- route-max: 120KB\n';
          } catch (error) {
            sizeComment += '⚠️ Size analysis not available\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: sizeComment
          });

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.20.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --workspaces
      
    - name: Build all components
      run: |
        npm -w frontend run build
        npm -w functions run build
        npm -w packages/memory-sdk run build
        npm -w packages/mcp-server run build
    
    - name: Deploy to Firebase
      run: firebase deploy --only hosting,functions
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }} 