name: validation
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18.20.3', cache: 'npm' }
      - run: npm ci
      - name: Start Firebase emulators (background)
        run: |
          npx firebase-tools@13 emulators:start --only auth,firestore,functions --project demo --import ./__tests__/e2e/.cache --export-on-exit --debug &
          sleep 15
      - run: npm run test:smoke
      - run: npm run test:e2e
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with: { name: validation-reports, path: reports }
