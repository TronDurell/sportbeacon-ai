name: Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci
          
      - name: Run Frontend Tests with Coverage
        run: |
          cd frontend
          npm run test:coverage
          
      - name: Run Backend Tests
        run: |
          cd backend
          npm test
          
      - name: Run Integration Tests
        run: |
          npm run test:integration
          
      - name: Run E2E Tests
        run: |
          npm run test:e2e
          
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          
      - name: Generate Coverage Report
        run: |
          npm run coverage:report
          
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  performance-testing:
    name: Performance Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/login
            http://localhost:3000/dashboard
          uploadArtifacts: true
          temporaryPublicStorage: true
          
      - name: Run Bundle Analysis
        run: |
          npm run analyze:bundle
          
      - name: Run Performance Tests
        run: |
          npm run test:performance
          
      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-reports/
          retention-days: 30

  security-testing:
    name: Security Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Security Tests
        run: |
          npm run test:security
          
      - name: Run Authentication Tests
        run: |
          npm run test:auth
          
      - name: Run Input Validation Tests
        run: |
          npm run test:validation
          
      - name: Upload Security Test Report
        uses: actions/upload-artifact@v4
        with:
          name: security-test-report
          path: security-test-reports/
          retention-days: 30

  accessibility-testing:
    name: Accessibility Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Start application
        run: |
          npm run start &
          sleep 30
          
      - name: Run Accessibility Tests
        run: |
          npm run test:accessibility
          
      - name: Run WCAG Compliance Check
        run: |
          npm run test:wcag
          
      - name: Upload Accessibility Report
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: accessibility-reports/
          retention-days: 30

  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-coverage, performance-testing, security-testing, accessibility-testing]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Test Reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          
      - name: Download Performance Reports
        uses: actions/download-artifact@v4
        with:
          name: performance-report
          path: reports/performance/
          
      - name: Download Security Test Reports
        uses: actions/download-artifact@v4
        with:
          name: security-test-report
          path: reports/security/
          
      - name: Download Accessibility Reports
        uses: actions/download-artifact@v4
        with:
          name: accessibility-report
          path: reports/accessibility/
          
      - name: Generate Test Summary
        run: |
          echo "# Test Report" > test-summary.md
          echo "Generated: $(date)" >> test-summary.md
          echo "" >> test-summary.md
          echo "## Test Results" >> test-summary.md
          echo "- Coverage: ${{ needs.test-coverage.result }}" >> test-summary.md
          echo "- Performance: ${{ needs.performance-testing.result }}" >> test-summary.md
          echo "- Security: ${{ needs.security-testing.result }}" >> test-summary.md
          echo "- Accessibility: ${{ needs.accessibility-testing.result }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "## Coverage Summary" >> test-summary.md
          if [ -f "reports/coverage/coverage-summary.json" ]; then
            cat reports/coverage/coverage-summary.json | jq -r '.total.lines.pct' >> test-summary.md
          fi
          
      - name: Upload Test Summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 90
          
      - name: Notify Test Failures
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#testing'
          text: 'Test failures detected in SportBeaconAI'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 