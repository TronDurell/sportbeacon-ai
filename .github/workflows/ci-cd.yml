name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  # Linting and Type Checking
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

  # Unit and Integration Tests
  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    strategy:
      matrix:
        test-type: [unit, integration, forms, auth, validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ${{ matrix.test-type }} tests with flaky detection
        working-directory: frontend
        run: |
          start_time=$(date +%s)
          npm run test:${{ matrix.test-type }} -- --detectOpenHandles --forceExit --verbose
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Test duration: ${duration}s"
          if [ $duration -gt 300 ]; then
            echo "⚠️ Tests took ${duration}s (>5min) - consider optimization"
          fi

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          directory: frontend/coverage
          flags: ${{ matrix.test-type }}
          name: ${{ matrix.test-type }}-coverage

  # Full Test Suite with Coverage
  test-coverage:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run full test suite with coverage and flaky detection
        working-directory: frontend
        run: |
          start_time=$(date +%s)
          npm run test:coverage -- --detectOpenHandles --forceExit --verbose
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Full test suite duration: ${duration}s"
          if [ $duration -gt 600 ]; then
            echo "⚠️ Full test suite took ${duration}s (>10min) - consider optimization"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: frontend/coverage
          flags: full-suite
          name: full-coverage

      - name: Check coverage thresholds
        working-directory: frontend
        run: |
          if [ -f "coverage/lcov-report/index.html" ]; then
            echo "Coverage report generated successfully"
            # Check if coverage meets thresholds (handled by Jest config)
          else
            echo "Coverage report not found"
            exit 1
          fi

  # Build
  build:
    runs-on: ubuntu-latest
    needs: [test-coverage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/dist/
            frontend/.next/
            frontend/build/
          key: ${{ runner.os }}-build-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application with time monitoring
        working-directory: frontend
        run: |
          start_time=$(date +%s)
          npm run build
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Build duration: ${duration}s"
          if [ $duration -gt 300 ]; then
            echo "⚠️ Build took ${duration}s (>5min) - consider optimization"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: frontend/dist

  # Security Audit
  security-audit:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run security audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

  # Performance Check
  performance-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: frontend/dist

      - name: Run Lighthouse CI
        working-directory: frontend
        run: npm run audit:ci

  # Health Check
  health-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run deployment health check
        run: npm run check-deploy

  # Deploy to Vercel (if push to main)
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [test-coverage, build, security-audit, performance-check, health-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: frontend/dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend

  # Deploy to Firebase (if push to main)
  deploy-firebase:
    runs-on: ubuntu-latest
    needs: [test-coverage, build, security-audit, performance-check, health-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-files
          path: frontend/dist

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}

  # Notifications
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-firebase]
    if: always()
    steps:
      - name: Notify on success
        if: needs.deploy-vercel.result == 'success' && needs.deploy-firebase.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "Vercel: ${{ needs.deploy-vercel.result }}"
          echo "Firebase: ${{ needs.deploy-firebase.result }}"

      - name: Notify on failure
        if: needs.deploy-vercel.result == 'failure' || needs.deploy-firebase.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Vercel: ${{ needs.deploy-vercel.result }}"
          echo "Firebase: ${{ needs.deploy-firebase.result }}"
          exit 1

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 