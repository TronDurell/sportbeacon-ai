name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend image
      run: |
        docker build -f backend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/sportbeacon-backend:${{ inputs.version }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/sportbeacon-backend:${{ inputs.version }}
    
    - name: Build and push frontend image
      run: |
        docker build -f frontend/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/sportbeacon-frontend:${{ inputs.version }} ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/sportbeacon-frontend:${{ inputs.version }}
    
    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ inputs.version }}
        release_name: Release v${{ inputs.version }}
        body: |
          ## SportBeacon AI v${{ inputs.version }}
          
          ### Changes
          - Backend and frontend updates
          - Docker images built and pushed
          
          ### Deployment
          Environment: ${{ inputs.environment }}
          
          ### Docker Images
          - Backend: `${{ secrets.DOCKER_USERNAME }}/sportbeacon-backend:${{ inputs.version }}`
          - Frontend: `${{ secrets.DOCKER_USERNAME }}/sportbeacon-frontend:${{ inputs.version }}`
        draft: false
        prerelease: false
