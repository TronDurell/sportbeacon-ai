name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend && npm ci
          
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=high
          
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript, python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Run SonarQube Analysis
        uses: sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerHomeDir: /opt/sonar-scanner
          
      - name: Run OWASP ZAP Security Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: 'http://localhost:3000'
          
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SportBeaconAI'
          path: '.'
          format: 'HTML'
          out: 'reports'
          
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/
          retention-days: 30
          
      - name: Notify Security Issues
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#security'
          text: 'Security vulnerabilities detected in SportBeaconAI'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: HEAD~1
          
      - name: Run GitGuardian Scan
        run: |
          # GitGuardian scan would be configured here if API key is available
          echo "GitGuardian scan skipped - API key not configured"
          
      - name: Run Detect Secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
          
  compliance-check:
    name: Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run License Check
        uses: apache/skywalking-eyes@main
        
      - name: Run SPDX License Check
        run: |
          npm install -g license-checker
          license-checker --summary --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause"
          
      - name: Run GDPR Compliance Check
        run: |
          # Check for PII in code
          grep -r -i "password\|ssn\|credit.*card\|email" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" . || true
          
      - name: Run Accessibility Check
        run: |
          npm install -g axe-core
          # Run accessibility tests
          
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, secrets-scan, compliance-check]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          name: security-report
          path: reports/
          
      - name: Generate Security Summary
        run: |
          echo "# Security Scan Report" > security-summary.md
          echo "Generated: $(date)" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Scan Results" >> security-summary.md
          echo "- Snyk: ${{ needs.security-scan.result }}" >> security-summary.md
          echo "- CodeQL: ${{ needs.security-scan.result }}" >> security-summary.md
          echo "- SonarQube: ${{ needs.security-scan.result }}" >> security-summary.md
          echo "- Secrets Scan: ${{ needs.secrets-scan.result }}" >> security-summary.md
          echo "- Compliance: ${{ needs.compliance-check.result }}" >> security-summary.md
          
      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90 