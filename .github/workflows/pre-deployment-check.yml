name: Pre-Deployment Readiness Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'production'
        type: choice
        options:
        - development
        - staging
        - production

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run Pre-Deployment Risk Scoring Engine
      run: node scripts/pre-deployment-check.js
      env:
        CI: true
        NODE_ENV: ${{ github.event.inputs.environment || 'production' }}
    
    - name: Upload Deployment Readiness Data
      uses: actions/upload-artifact@v4
      with:
        name: deployment-readiness-data
        path: TODO2_DEPLOYMENT_DATA.json
        retention-days: 30
    
    - name: Parse Readiness Data
      id: readiness
      run: |
        if [ -f "TODO2_DEPLOYMENT_DATA.json" ]; then
          READINESS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('TODO2_DEPLOYMENT_DATA.json')).overallReadiness)")
          echo "readiness=$READINESS" >> $GITHUB_OUTPUT
          echo "data=$(cat TODO2_DEPLOYMENT_DATA.json | jq -c .)" >> $GITHUB_OUTPUT
        else
          echo "readiness=0" >> $GITHUB_OUTPUT
          echo "data={}" >> $GITHUB_OUTPUT
        fi
    
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let data = {};
          let readiness = 0;
          
          try {
            data = JSON.parse(fs.readFileSync('TODO2_DEPLOYMENT_DATA.json', 'utf8'));
            readiness = data.overallReadiness || 0;
          } catch (error) {
            console.log('No deployment data found');
          }
          
          const status = readiness >= 80 ? '✅ **READY FOR DEPLOYMENT**' : '🚨 **DEPLOYMENT BLOCKED**';
          const recommendation = readiness >= 80 ? '🎉 **All checks passed!**' : '⚠️ **Please complete critical tasks before merging**';
          
          const comment = `## 🚀 Pre-Deployment Readiness Check
          
          **Overall Readiness:** ${readiness}%
          
          ${status}
          
          ### 📊 Breakdown:
          - **Critical Tasks:** ${data.week1Critical?.length || 0} remaining
          - **Cleanup Tasks:** ${data.consoleCleanup?.length || 0} remaining
          - **Testing Tasks:** ${data.testing?.length || 0} remaining
          - **Environment Tasks:** ${data.environment?.length || 0} remaining
          
          ### 🔍 Details:
          ${data.week1Critical?.length > 0 ? `**Firebase Functions Needing Validation:**\n${data.week1Critical.map(task => `- ${task.title}`).join('\n')}\n` : ''}
          ${data.environment?.length > 0 ? `**Missing Environment Files:**\n${data.environment.map(task => `- ${task.title}`).join('\n')}\n` : ''}
          
          ${recommendation}
          
          ---
          *Generated by SportBeaconAI Pre-Deployment Risk Scoring Engine*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Create Deployment Status Check
      uses: actions/github-script@v7
      with:
        script: |
          const readiness = ${{ steps.readiness.outputs.readiness }};
          const status = readiness >= 80 ? 'success' : 'failure';
          const description = readiness >= 80 ? 'Ready for deployment' : 'Deployment blocked - readiness below 80%';
          
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: status,
            target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            description: description,
            context: 'Pre-Deployment Readiness'
          });
    
    - name: Fail if not ready
      if: steps.readiness.outputs.readiness < 80
      run: |
        echo "🚨 DEPLOYMENT BLOCKED: Readiness score is ${{ steps.readiness.outputs.readiness }}% (minimum 80% required)"
        echo "Please complete critical tasks before merging this PR"
        exit 1
    
    - name: Success message
      if: steps.readiness.outputs.readiness >= 80
      run: |
        echo "✅ DEPLOYMENT READY: Readiness score is ${{ steps.readiness.outputs.readiness }}%"
        echo "All critical checks passed - safe to deploy!"

  notify-team:
    needs: readiness-check
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download deployment data
      uses: actions/download-artifact@v4
      with:
        name: deployment-readiness-data
        path: ./
    
    - name: Send notification
      if: needs.readiness-check.result == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let data = {};
          
          try {
            data = JSON.parse(fs.readFileSync('TODO2_DEPLOYMENT_DATA.json', 'utf8'));
          } catch (error) {
            console.log('No deployment data found');
          }
          
          const readiness = data.overallReadiness || 0;
          
          // Create issue for tracking
          const issueTitle = `🚨 Deployment Readiness Alert - ${readiness}%`;
          const issueBody = `## Deployment Readiness Alert
          
          **Current Readiness:** ${readiness}%
          **Required:** 80%+
          
          ### Critical Tasks Remaining:
          ${data.week1Critical?.map(task => `- [ ] ${task.title}`).join('\n') || 'None'}
          
          ### Environment Issues:
          ${data.environment?.map(task => `- [ ] ${task.title}`).join('\n') || 'None'}
          
          ### Next Steps:
          1. Complete Firebase functions validation
          2. Set up environment files
          3. Run readiness check again
          
          ---
          *Auto-generated by Pre-Deployment Risk Scoring Engine*
          `;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: issueTitle,
            body: issueBody,
            labels: ['deployment', 'critical', 'readiness-alert']
          }); 