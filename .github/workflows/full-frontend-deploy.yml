name: Full Frontend Deploy

on:
  push:
    branches: [main, vanguard-*, townrec-*]
  pull_request:
    branches: [main, vanguard-*, townrec-*]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_OPENAI_KEY: ${{ secrets.VITE_OPENAI_KEY }}
  VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
  VITE_STRIPE_KEY: ${{ secrets.VITE_STRIPE_KEY }}

jobs:
  # Pre-flight validation
  pre-flight:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run DevOps automation checks
      run: node scripts/sportbeacon-devops-automation.js --check-only
      working-directory: ./

  # Strict TypeScript checking
  type-check:
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run strict TypeScript check
      run: npx tsc --noEmit --strict
      working-directory: ./frontend

    - name: Check for TodoFixMe usage
      run: |
        TODO_FIXME_COUNT=$(grep -r "TodoFixMe" frontend backend ai lib functions --include="*.ts" --include="*.tsx" | wc -l)
        if [ $TODO_FIXME_COUNT -gt 0 ]; then
          echo "⚠️ Found $TODO_FIXME_COUNT TodoFixMe usages"
          echo "Please replace TodoFixMe types with proper TypeScript interfaces"
          exit 1
        fi
        echo "✅ No TodoFixMe usage found"

    - name: Check for console.log statements
      run: |
        CONSOLE_LOG_COUNT=$(grep -r "console\.log" frontend/src --include="*.ts" --include="*.tsx" | wc -l)
        if [ $CONSOLE_LOG_COUNT -gt 0 ]; then
          echo "⚠️ Found $CONSOLE_LOG_COUNT console.log statements in production code"
          echo "Please clean up console.log statements before deployment"
          exit 1
        fi
        echo "✅ No console.log statements found in production code"

  # Linting and formatting
  lint:
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run ESLint
      run: npm run lint
      working-directory: ./frontend

    - name: Check code formatting
      run: npm run format:check
      working-directory: ./frontend

  # Comprehensive testing
  test:
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run ${{ matrix.test-type }} tests
      run: npm run test:${{ matrix.test-type }}
      working-directory: ./frontend

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        directory: frontend/coverage
        flags: ${{ matrix.test-type }}
        name: ${{ matrix.test-type }}-coverage

  # Security audit
  security:
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run security audit
      run: npm audit --audit-level=moderate
      working-directory: ./frontend

    - name: Check for exposed secrets
      run: |
        # Check for potential secrets in code
        SECRETS_FOUND=$(grep -r -i "sk_test\|sk_live\|password\|secret\|key" frontend/src --include="*.ts" --include="*.tsx" | grep -v "//" | wc -l)
        if [ $SECRETS_FOUND -gt 0 ]; then
          echo "⚠️ Potential secrets found in code"
          grep -r -i "sk_test\|sk_live\|password\|secret\|key" frontend/src --include="*.ts" --include="*.tsx" | grep -v "//"
          exit 1
        fi
        echo "✅ No exposed secrets found"

  # Build and deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/vanguard-') || startsWith(github.ref, 'refs/heads/townrec-')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Build frontend
      run: npm run build
      working-directory: ./frontend

    - name: Upload production build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-prod-build
        path: frontend/dist

    - name: Deploy to Firebase Hosting
      uses: w9jds/firebase-action@v13.1.0
      with:
        args: deploy --only hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_DEPLOY_TOKEN }}

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend

  # Generate deployment report
  report:
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Generate deployment report
      run: node scripts/sportbeacon-devops-automation.js --generate-report

    - name: Upload deployment report
      uses: actions/upload-artifact@v4
      with:
        name: deployment-report
        path: |
          devops-automation-report.json
          DEVOP_AUTOMATION_REPORT.md

    - name: Comment PR with deployment status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ needs.build-and-deploy.result }}';
          const statusEmoji = status === 'success' ? '✅' : '❌';
          const statusText = status === 'success' ? 'DEPLOYED' : 'FAILED';
          
          const comment = \`## 🚀 Deployment Status
          
          \${statusEmoji} **Status**: \${statusText}
          
          ### Deployment Details:
          - **Branch**: \${context.payload.pull_request.head.ref}
          - **Commit**: \${context.payload.pull_request.head.sha.substring(0, 7)}
          - **Environment**: Production
          
          ### Next Steps:
          \${status === 'success' ? '🎉 Deployment successful! Ready for testing.' : '⚠️ Deployment failed. Please check the logs.'}
          
          ---
          *Generated by SportBeaconAI DevOps Automation*
          \`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Notifications
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, report]
    if: always()
    steps:
    - name: Notify on success
      if: needs.build-and-deploy.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"

    - name: Notify on failure
      if: needs.build-and-deploy.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        exit 1

    - name: Slack notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 