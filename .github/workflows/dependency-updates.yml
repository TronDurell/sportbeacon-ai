name: Dependency Updates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  # Validate Dependabot PRs
  validate-dependabot:
    name: Validate Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run type checking
        working-directory: ./frontend
        run: npm run type-check

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build:prod

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## 🤖 Dependabot Validation Results')
            );
            
            const status = '${{ job.status }}';
            const statusEmoji = status === 'success' ? '✅' : '❌';
            const statusText = status === 'success' ? 'PASSED' : 'FAILED';
            
            const commentBody = `## 🤖 Dependabot Validation Results
            
            ${statusEmoji} **Status**: ${statusText}
            
            ### Validation Steps:
            - [${status === 'success' ? 'x' : ' '}] Linting
            - [${status === 'success' ? 'x' : ' '}] Type Checking
            - [${status === 'success' ? 'x' : ' '}] Unit Tests
            - [${status === 'success' ? 'x' : ' '}] Build
            
            ${status === 'success' ? '🎉 All checks passed! This PR is ready for review.' : '⚠️ Some checks failed. Please review the logs.'}
            
            ---
            *This comment was automatically generated by GitHub Actions.*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

  # Auto-merge minor and patch updates
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')
    needs: validate-dependabot
    
    steps:
      - name: Enable auto-merge for Dependabot PRs
        if: needs.validate-dependabot.result == 'success'
        run: |
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Security audit for dependency updates
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run security audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

      - name: Comment security results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const securityComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## 🔒 Security Audit Results')
            );
            
            const status = '${{ job.status }}';
            const statusEmoji = status === 'success' ? '✅' : '⚠️';
            const statusText = status === 'success' ? 'PASSED' : 'ISSUES FOUND';
            
            const commentBody = `## 🔒 Security Audit Results
            
            ${statusEmoji} **Status**: ${statusText}
            
            ${status === 'success' ? '✅ No security vulnerabilities found.' : '⚠️ Security vulnerabilities detected. Please review before merging.'}
            
            ---
            *This comment was automatically generated by GitHub Actions.*`;
            
            if (securityComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: securityComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            } 