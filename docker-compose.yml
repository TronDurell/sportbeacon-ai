version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OPENAI_API_KEY
      - FRONTEND_ORIGIN=http://localhost:3002
      - ENABLE_METRICS=true
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - backend