version: '3.9'
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
  web:
    build: ./frontend
    ports:
      - "3002:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:8000
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://api:8000

